<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Project Eclipse</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="../img/bongiku_logo_NT.png" alt="Bongiku logo">
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="characters.html">Characters</a></li>
                <li><a href="about.html">About Us</a></li>
            </ul>
            <div class="nav-actions">
                <a class="nav-login-button" href="login.html" data-account-href="account.html">Login</a>
            </div>
        </div>
    </nav>

    <main class="login-main">
        <section class="login-card" aria-label="Register form">
            <h1>Create Account</h1>
            <p class="login-subtitle">Set up a new account to get started.</p>
            <form class="login-form" data-register-form data-redirect="../index.html">
                <label class="login-label" for="register-username">Username</label>
                <input class="login-input" id="register-username" name="username" type="text" autocomplete="username" required>

                <label class="login-label" for="register-password">Password</label>
                <input class="login-input" id="register-password" name="password" type="password" autocomplete="new-password" required>

                <button class="login-submit" type="submit">Create Account</button>
                <p class="login-message" role="status" aria-live="polite"></p>
            </form>
            <p class="login-help">Already have an account? <a href="login.html">Sign in</a></p>
        </section>
    </main>

    <script src="../main.js"></script>
</body>
</html>
