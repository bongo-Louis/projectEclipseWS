<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Project Eclipse</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body class="account-page">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="../img/bongiku_logo_NT.png" alt="Bongiku logo">
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="characters.html">Characters</a></li>
                <li><a href="about.html">About Us</a></li>
            </ul>
            <div class="nav-actions">
                <a class="nav-login-button" href="account.html" data-account-href="account.html">Account</a>
            </div>
        </div>
    </nav>

    <main class="account-main">
        <section class="account-card">
            <div class="account-header">
                <div class="account-avatar">
                    <img src="" alt="Profile picture" data-account-avatar>
                    <span class="account-avatar-fallback" data-account-fallback>?</span>
                </div>
                <div class="account-info">
                    <p class="account-label">Signed in as</p>
                    <h1 data-account-username>Guest</h1>
                    <p class="account-subtitle">Upload a new profile picture for your account.</p>
                </div>
            </div>

            <form class="account-form" data-account-form>
                <label class="account-upload">
                    <span>Select a new profile picture</span>
                    <input type="file" accept="image/*" data-account-file>
                </label>
                <div class="account-actions">
                    <button class="account-save" type="submit" data-account-save>Upload and save</button>
                    <p class="account-status" data-account-status></p>
                </div>
                <p class="account-guard" data-account-guard>
                    Please log in to update your profile.
                    <a href="login.html">Go to login</a>
                </p>
            </form>
        </section>
    </main>

    <script src="../main.js"></script>
</body>
</html>
