<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Project Eclipse</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="../img/bongiku_logo_NT.png" alt="Bongiku logo">
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="characters.html">Characters</a></li>
                <li><a href="about.html">About Us</a></li>
            </ul>
            <div class="nav-actions">
                <a class="nav-login-button active" href="login.html" data-account-href="account.html">Login</a>
            </div>
        </div>
    </nav>

    <main class="login-main">
        <section class="login-card" aria-label="Login form">
            <h1>Welcome Back</h1>
            <p class="login-subtitle">Sign in to continue your journey.</p>
            <form class="login-form" data-login-form data-redirect="characters.html">
                <label class="login-label" for="login-username">Username</label>
                <input class="login-input" id="login-username" name="username" type="text" autocomplete="username" required>

                <label class="login-label" for="login-password">Password</label>
                <input class="login-input" id="login-password" name="password" type="password" autocomplete="current-password" required>

                <button class="login-submit" type="submit">Sign In</button>
                <p class="login-message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="../main.js"></script>
</body>
</html>
