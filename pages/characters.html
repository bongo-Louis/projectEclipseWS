<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Characters - Project Eclipse</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body class="characters-page">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span>Logo</span>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="characters.html" class="active">Characters</a></li>
                <li><a href="about.html">About Us</a></li>
            </ul>
        </div>
    </nav>

    <div class="side-triangle" aria-hidden="true">
    </div>

    <div class="red-triangle">
        <span class="red-triangle-text">Character Introductions</span>
    </div>

    <main class="characters-main">
        <div class="character-card">
            <div class="character-image">
                <img src="../img/Tora.png" alt="Tora the Incineroar">
            </div>
            <div class="character-info">
                <h1>Tora</h1>
                <h2>The Incineroar</h2>
                <p>"It's rough and aggressive behavior is its most notable trait, but the way it helps out small Pokémon shows that it has a kind side as well."</p>
            </div>
        </div>

        <div class="character-thumbnails-wrap">
            <div class="character-thumbnails">
                <button class="character-thumb active" data-character="tora">
                    <img src="../img/Tora_Thumb.png" alt="Tora">
                </button>
                <button class="character-thumb" data-character="mimi">
                    <img src="../img/Mimi_Thumb.png" alt="Mimi">
                </button>
                <button class="character-thumb" data-character="necro">
                    <img src="../img/Necro_Thumb.png" alt="Necro">
                </button>
                <button class="character-thumb" data-character="luna">
                    <img src="../img/Luna_Thumb.png" alt="Luna">
                </button>
                <button class="character-thumb" data-character="sol">
                    <img src="../img/Sol_Thumb.png" alt="Sol">
                </button>
            </div>
        </div>
    </main>
    <script src="../main.js"></script>
</body>
</html>
